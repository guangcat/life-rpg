name: Life RPG checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - run: node AI辅助/_selftest.js
      - name: Verify offline assets
        run: |
          node --input-type=module -e "import fs from 'node:fs';const src=fs.readFileSync('sw.js','utf8');for(const p of [...src.matchAll(/'\.\/([^']+)'/g)].map(m=>m[1])){if(!fs.existsSync(p))throw Error('Missing '+p)}"
